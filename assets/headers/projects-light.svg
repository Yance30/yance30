<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="76" viewBox="0 0 1000 76">
  <style>
    .path  { animation: fadeIn .5s ease-out both; }
    .title { animation: fadeUp .6s ease-out .15s both; }
    .under { transform-box: fill-box; transform-origin: left center; animation: grow .7s cubic-bezier(.2,.7,.2,1) .45s both; }
    .rule  { transform-box: fill-box; transform-origin: left center; animation: grow 1.4s cubic-bezier(.3,.6,.2,1) .7s both; }
    .caret { animation: blink 1.1s steps(1) 1.2s infinite; }
    @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
    
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes grow   { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes pop    { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
  @keyframes sweep  { 0% { transform: translateX(-400px); } 55%, 100% { transform: translateX(var(--sweep-end)); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="rule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d1d9e0"/><stop offset="100%" stop-color="#d1d9e0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="under" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0969da"/><stop offset="100%" stop-color="#0969da" stop-opacity=".2"/>
    </linearGradient>
  </defs>
  <text class="path" x="0" y="46" font-family="Consolas, Menlo, 'SF Mono', 'DejaVu Sans Mono', monospace" font-size="26" fill="#0969da">~/</text>
  <text class="title" x="40" y="46" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="700" fill="#1f2328">Featured Projects</text>
  <rect class="caret" x="344" y="22" width="3" height="30" fill="#0969da"/>
  <rect class="under" x="42" y="60" width="72" height="3" rx="1.5" fill="url(#under)"/>
  <rect class="rule" x="392" y="37" width="608" height="1.5" fill="url(#rule)"/>
</svg>
