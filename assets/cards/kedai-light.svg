<svg xmlns="http://www.w3.org/2000/svg" width="800" height="350" viewBox="0 0 800 350">
  <style>
    .card   { animation: fadeUp .7s ease-out both; }
    .tag    { animation: fadeIn .6s ease-out .2s both; }
    .title  { animation: fadeUp .7s ease-out .25s both; }
    .accent { transform-box: fill-box; transform-origin: left center; animation: grow .8s cubic-bezier(.2,.7,.2,1) .5s both; }
    .desc   { animation: fadeIn .8s ease-out .6s both; }
    .chip   { transform-box: fill-box; transform-origin: center; animation: pop .45s ease-out both; }
    .shine  { --sweep-end: 1200px; animation: sweep 6s ease-in-out 1.5s infinite; }
    .spin { transform-box: view-box; transform-origin: 700px 88px; animation: spin 3.2s cubic-bezier(.6,0,.4,1) infinite; }
          .status { animation: status 6.4s steps(1) infinite; }
          @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
          @keyframes status { 0%, 50% { fill: #818b98; } 50.01%, 100% { fill: #0969da; } }
    
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes grow   { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes pop    { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
  @keyframes sweep  { 0% { transform: translateX(-400px); } 55%, 100% { transform: translateX(var(--sweep-end)); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f0f3f6" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="88%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#0969da" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0969da" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0969da"/><stop offset="100%" stop-color="#0969da" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0969da" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0969da" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#0969da" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="1" y="1" width="798" height="348" rx="16"/></clipPath>
  </defs>
  <g class="card">
    <g clip-path="url(#clip)">
      <rect width="800" height="350" fill="#ffffff"/>
      <rect width="800" height="350" fill="url(#grid)"/>
      <rect width="800" height="350" fill="url(#glow)"/>
      <rect class="shine" x="0" y="0" width="400" height="3" fill="url(#shine)"/>
    </g>
    <rect x="1" y="1" width="798" height="348" rx="16" fill="none" stroke="#d1d9e0" stroke-width="2"/>
    <text class="tag" x="40" y="60" font-family="Consolas, Menlo, 'SF Mono', 'DejaVu Sans Mono', monospace" font-size="19" fill="#0969da">// local-first · installable pwa</text>
    <text class="title" x="40" y="118" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="700" fill="#1f2328">Kedai Rakdjat POS</text>
    <rect class="accent" x="40" y="138" width="120" height="3" rx="1.5" fill="url(#line)"/>
    <g class="desc"><text x="40" y="200" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#59636e">Point of sale that keeps selling offline and</text><text x="40" y="236" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#59636e">syncs on reconnect, with kitchen display &amp; QRIS.</text></g>
    <g class="chip" style="animation-delay:0.9s">
      <rect x="40" y="272" width="96" height="44" rx="22" fill="#f6f8fa" stroke="#d1d9e0"/>
      <text x="88" y="302" text-anchor="middle" font-family="Consolas, Menlo, 'SF Mono', 'DejaVu Sans Mono', monospace" font-size="21" fill="#59636e">React</text>
    </g><g class="chip" style="animation-delay:1s">
      <rect x="146" y="272" width="158" height="44" rx="22" fill="#f6f8fa" stroke="#d1d9e0"/>
      <text x="225" y="302" text-anchor="middle" font-family="Consolas, Menlo, 'SF Mono', 'DejaVu Sans Mono', monospace" font-size="21" fill="#59636e">TypeScript</text>
    </g><g class="chip" style="animation-delay:1.1s">
      <rect x="314" y="272" width="133" height="44" rx="22" fill="#f6f8fa" stroke="#d1d9e0"/>
      <text x="380.5" y="302" text-anchor="middle" font-family="Consolas, Menlo, 'SF Mono', 'DejaVu Sans Mono', monospace" font-size="21" fill="#59636e">Supabase</text>
    </g><g class="chip" style="animation-delay:1.2000000000000002s">
      <rect x="457" y="272" width="96" height="44" rx="22" fill="#f6f8fa" stroke="#d1d9e0"/>
      <text x="505" y="302" text-anchor="middle" font-family="Consolas, Menlo, 'SF Mono', 'DejaVu Sans Mono', monospace" font-size="21" fill="#59636e">Dexie</text>
    </g>
    
      <g class="spin" fill="none" stroke="#0969da" stroke-width="5" stroke-linecap="round">
        <path d="M 672 80 A 30 30 0 0 1 726 72"/>
        <path d="M 728 96 A 30 30 0 0 1 674 104"/>
        <path d="M 716 62 L 728 72 L 714 80" stroke-linejoin="round"/>
        <path d="M 684 114 L 672 104 L 686 96" stroke-linejoin="round"/>
      </g>
      <circle class="status" cx="752" cy="132" r="6" fill="#0969da"/>
  </g>
</svg>
