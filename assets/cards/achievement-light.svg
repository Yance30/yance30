<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="150" viewBox="0 0 1500 150">
  <style>
    .card   { animation: fadeUp .7s ease-out both; }
    .trophy { transform-box: fill-box; transform-origin: center bottom; animation: pop .6s cubic-bezier(.2,1.4,.4,1) .3s both, tilt 5s ease-in-out 1.2s infinite; }
    .spark  { transform-box: fill-box; transform-origin: center; animation: twinkle 2.4s ease-in-out infinite; }
    .s2 { animation-delay: .8s; } .s3 { animation-delay: 1.6s; }
    .t1 { animation: fadeUp .7s ease-out .4s both; }
    .t2 { animation: fadeUp .7s ease-out .6s both; }
    .badge { animation: fadeIn .6s ease-out .9s both; }
    .shine { --sweep-end: 1900px; animation: sweep 5s ease-in-out 1s infinite; }
    @keyframes tilt { 0%, 100% { transform: rotate(0deg); } 10% { transform: rotate(-6deg); } 20% { transform: rotate(5deg); } 30% { transform: rotate(0deg); } }
    @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.4); } 50% { opacity: 1; transform: scale(1); } }
    
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes grow   { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes pop    { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
  @keyframes sweep  { 0% { transform: translateX(-400px); } 55%, 100% { transform: translateX(var(--sweep-end)); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f0f3f6" stroke-width="1"/>
    </pattern>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4a72c" stop-opacity="0"/>
      <stop offset="50%" stop-color="#d4a72c" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#d4a72c" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="6%" cy="50%" r="30%">
      <stop offset="0%" stop-color="#d4a72c" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#d4a72c" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect x="1" y="1" width="1498" height="148" rx="16"/></clipPath>
  </defs>
  <g class="card">
    <g clip-path="url(#clip)">
      <rect width="1500" height="150" fill="#ffffff"/>
      <rect width="1500" height="150" fill="url(#grid)"/>
      <rect width="1500" height="150" fill="url(#glow)"/>
      <g transform="skewX(-20)"><rect class="shine" x="0" y="0" width="400" height="150" fill="url(#shine)"/></g>
    </g>
    <rect x="1" y="1" width="1498" height="148" rx="16" fill="none" stroke="#d1d9e0" stroke-width="2"/>
    <g class="trophy" fill="#9a6700">
      <path d="M 66 42 H 114 V 66 A 24 24 0 0 1 66 66 Z"/>
      <path d="M 66 48 H 54 A 12 14 0 0 0 66 74" fill="none" stroke="#9a6700" stroke-width="5"/>
      <path d="M 114 48 H 126 A 12 14 0 0 1 114 74" fill="none" stroke="#9a6700" stroke-width="5"/>
      <rect x="86" y="88" width="8" height="14"/>
      <rect x="72" y="102" width="36" height="8" rx="2"/>
    </g>
    <path class="spark" d="M 136 36 l 3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z" fill="#9a6700"/>
    <path class="spark s2" d="M 46 96 l 2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 z" fill="#9a6700"/>
    <path class="spark s3" d="M 128 104 l 2 4 4 2 -4 2 -2 4 -2 -4 -4 -2 4 -2 z" fill="#9a6700"/>
    <text class="t1" x="172" y="70" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="700" fill="#1f2328">1st Place — National Business Plan Competition</text>
    <text class="t2" x="172" y="110" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#59636e">Youth Economics Science Competition (YES-C) 2026 · Universitas Negeri Padang</text>
    <g class="badge">
      <rect x="1260" y="52" width="200" height="46" rx="23" fill="none" stroke="#9a6700" stroke-width="1.5"/>
      <text x="1360" y="82" text-anchor="middle" font-family="Consolas, Menlo, 'SF Mono', 'DejaVu Sans Mono', monospace" font-size="19" fill="#9a6700">NATIONAL · 2026</text>
    </g>
  </g>
</svg>
