<svg xmlns="http://www.w3.org/2000/svg" width="800" height="350" viewBox="0 0 800 350">
  <style>
    .card   { animation: fadeUp .7s ease-out 0.36s both; }
    .tag    { animation: fadeIn .6s ease-out 0.56s both; }
    .title  { animation: fadeUp .7s ease-out 0.61s both; }
    .accent { transform-box: fill-box; transform-origin: left center; animation: grow .8s cubic-bezier(.2,.7,.2,1) 0.86s both; }
    .desc   { animation: fadeIn .8s ease-out 0.96s both; }
    .chip   { transform-box: fill-box; transform-origin: center; animation: pop .45s ease-out both; }
    .shine  { --sweep-end: 1200px; animation: sweep 8s ease-in-out 1.86s infinite; }
    .ecg { stroke-dasharray: 60 240; animation: trace 4.5s ease-in-out infinite; }
          .ecg-base { stroke-opacity: .25; }
          .beacon { transform-box: fill-box; transform-origin: center; animation: ping 4.5s ease-out 2.2s infinite; }
          @keyframes trace { 0% { stroke-dashoffset: 300; opacity: 0; } 5% { opacity: 1; } 50% { stroke-dashoffset: 60; opacity: 1; } 60%, 100% { stroke-dashoffset: 60; opacity: 0; } }
          @keyframes ping { 0% { transform: scale(1); opacity: .8; } 45%, 100% { transform: scale(2.6); opacity: 0; } }
    
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes grow   { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes pop    { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
  @keyframes sweep  { 0% { transform: translateX(-400px); } 55%, 100% { transform: translateX(var(--sweep-end)); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161b22" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="88%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/><stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="1" y="1" width="798" height="348" rx="16"/></clipPath>
  </defs>
  <g class="card">
    <g clip-path="url(#clip)">
      <rect width="800" height="350" fill="#0d1117"/>
      <rect width="800" height="350" fill="url(#grid)"/>
      <rect width="800" height="350" fill="url(#glow)"/>
      <rect class="shine" x="0" y="0" width="400" height="3" fill="url(#shine)"/>
    </g>
    <rect x="1" y="1" width="798" height="348" rx="16" fill="none" stroke="#30363d" stroke-width="2"/>
    <text class="tag" x="40" y="60" font-family="Consolas, Menlo, 'SF Mono', 'DejaVu Sans Mono', monospace" font-size="19" fill="#58a6ff">// web in action · mia 2026 · team</text>
    <text class="title" x="40" y="118" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="700" fill="#e6edf3">CivicPulse</text>
    <rect class="accent" x="40" y="138" width="120" height="3" rx="1.5" fill="url(#line)"/>
    <g class="desc"><text x="40" y="200" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#8b949e">AI-assisted civic reporting with photo recognition,</text><text x="40" y="236" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#8b949e">explainable priority scores, citizen-verified fixes.</text></g>
    <g class="chip" style="animation-delay:1.26s">
      <rect x="40" y="272" width="96" height="44" rx="22" fill="#161b22" stroke="#30363d"/>
      <text x="88" y="302" text-anchor="middle" font-family="Consolas, Menlo, 'SF Mono', 'DejaVu Sans Mono', monospace" font-size="21" fill="#8b949e">React</text>
    </g><g class="chip" style="animation-delay:1.36s">
      <rect x="146" y="272" width="84" height="44" rx="22" fill="#161b22" stroke="#30363d"/>
      <text x="188" y="302" text-anchor="middle" font-family="Consolas, Menlo, 'SF Mono', 'DejaVu Sans Mono', monospace" font-size="21" fill="#8b949e">Hono</text>
    </g><g class="chip" style="animation-delay:1.46s">
      <rect x="240" y="272" width="133" height="44" rx="22" fill="#161b22" stroke="#30363d"/>
      <text x="306.5" y="302" text-anchor="middle" font-family="Consolas, Menlo, 'SF Mono', 'DejaVu Sans Mono', monospace" font-size="21" fill="#8b949e">Supabase</text>
    </g><g class="chip" style="animation-delay:1.56s">
      <rect x="383" y="272" width="84" height="44" rx="22" fill="#161b22" stroke="#30363d"/>
      <text x="425" y="302" text-anchor="middle" font-family="Consolas, Menlo, 'SF Mono', 'DejaVu Sans Mono', monospace" font-size="21" fill="#8b949e">CLIP</text>
    </g>
    
      <path class="ecg-base" d="M 630 100 H 668 L 680 76 L 694 128 L 708 58 L 720 112 L 730 100 H 768" fill="none" stroke="#58a6ff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      <path class="ecg" d="M 630 100 H 668 L 680 76 L 694 128 L 708 58 L 720 112 L 730 100 H 768" pathLength="300" fill="none" stroke="#58a6ff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
      <circle class="beacon" cx="768" cy="100" r="6" fill="none" stroke="#e3b341" stroke-width="2"/>
      <circle cx="768" cy="100" r="5" fill="#e3b341"/>
  </g>
</svg>
