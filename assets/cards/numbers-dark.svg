<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="180" viewBox="0 0 1500 180">
  <style>
    .card { animation: fadeUp .7s ease-out both; }
    .lbl  { animation: fadeIn .8s ease-out .6s both; }
    .odo0 { transform: translateY(-456px); animation: roll0 1.6s cubic-bezier(.15,.8,.2,1) 0.3s both; }
            @keyframes roll0 { from { transform: translateY(0); } to { transform: translateY(-456px); } }
.odo1 { transform: translateY(-304px); animation: roll1 1.6s cubic-bezier(.15,.8,.2,1) 0.5s both; }
            @keyframes roll1 { from { transform: translateY(0); } to { transform: translateY(-304px); } }
.odo2 { transform: translateY(-152px); animation: roll2 1.6s cubic-bezier(.15,.8,.2,1) 0.7s both; }
            @keyframes roll2 { from { transform: translateY(0); } to { transform: translateY(-152px); } }
.odo3 { transform: translateY(-380px); animation: roll3 1.6s cubic-bezier(.15,.8,.2,1) 0.9000000000000001s both; }
            @keyframes roll3 { from { transform: translateY(0); } to { transform: translateY(-380px); } }
    
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes grow   { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes pop    { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
  @keyframes sweep  { 0% { transform: translateX(-400px); } 55%, 100% { transform: translateX(var(--sweep-end)); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161b22" stroke-width="1"/>
    </pattern>
    <clipPath id="digit"><rect x="-80" y="-62" width="160" height="76"/></clipPath>
    <clipPath id="clip"><rect x="1" y="1" width="1498" height="178" rx="16"/></clipPath>
  </defs>
  <g class="card">
    <g clip-path="url(#clip)">
      <rect width="1500" height="180" fill="#0d1117"/>
      <rect width="1500" height="180" fill="url(#grid)"/>
    </g>
    <rect x="1" y="1" width="1498" height="178" rx="16" fill="none" stroke="#30363d" stroke-width="2"/>
    
      <g transform="translate(205.5 96)">
        <g clip-path="url(#digit)"><g class="odo0"><text x="0" y="0" text-anchor="end" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="700" fill="#58a6ff">0</text><text x="0" y="76" text-anchor="end" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="700" fill="#58a6ff">1</text><text x="0" y="152" text-anchor="end" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="700" fill="#58a6ff">2</text><text x="0" y="228" text-anchor="end" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="700" fill="#58a6ff">3</text><text x="0" y="304" text-anchor="end" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="700" fill="#58a6ff">4</text><text x="0" y="380" text-anchor="end" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="700" fill="#58a6ff">5</text><text x="0" y="456" text-anchor="end" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="700" fill="#58a6ff">6</text></g></g>
      </g>
      
      <text class="lbl" x="187.5" y="142" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#8b949e">apps shipped &amp; live</text>
<line x1="375" y1="44" x2="375" y2="136" stroke="#30363d" stroke-width="2"/>
      <g transform="translate(580.5 96)">
        <g clip-path="url(#digit)"><g class="odo1"><text x="0" y="0" text-anchor="end" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="700" fill="#58a6ff">0</text><text x="0" y="76" text-anchor="end" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="700" fill="#58a6ff">1</text><text x="0" y="152" text-anchor="end" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="700" fill="#58a6ff">2</text><text x="0" y="228" text-anchor="end" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="700" fill="#58a6ff">3</text><text x="0" y="304" text-anchor="end" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="700" fill="#58a6ff">4</text></g></g>
      </g>
      
      <text class="lbl" x="562.5" y="142" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#8b949e">hackathons &amp; competitions</text>
<line x1="750" y1="44" x2="750" y2="136" stroke="#30363d" stroke-width="2"/>
      <g transform="translate(955.5 96)">
