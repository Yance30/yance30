<svg xmlns="http://www.w3.org/2000/svg" width="800" height="350" viewBox="0 0 800 350">
  <style>
    .card   { animation: fadeUp .7s ease-out both; }
    .tag    { animation: fadeIn .6s ease-out .2s both; }
    .title  { animation: fadeUp .7s ease-out .25s both; }
    .accent { transform-box: fill-box; transform-origin: left center; animation: grow .8s cubic-bezier(.2,.7,.2,1) .5s both; }
    .desc   { animation: fadeIn .8s ease-out .6s both; }
    .chip   { transform-box: fill-box; transform-origin: center; animation: pop .45s ease-out both; }
    .shine  { --sweep-end: 1200px; animation: sweep 6s ease-in-out 1.5s infinite; }
    .pin { animation: bob 2.4s ease-in-out infinite; }
          .ripple { transform-box: fill-box; transform-origin: center; animation: ripple 2.4s ease-out infinite; }
          .ripple2 { animation-delay: 1.2s; }
          @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
          @keyframes ripple { 0% { transform: scale(.3); opacity: .9; } 100% { transform: scale(1.6); opacity: 0; } }
    
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes grow   { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes pop    { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
  @keyframes sweep  { 0% { transform: translateX(-400px); } 55%, 100% { transform: translateX(var(--sweep-end)); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f0f3f6" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="88%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#0969da" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0969da" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0969da"/><stop offset="100%" stop-color="#0969da" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0969da" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0969da" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#0969da" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="1" y="1" width="798" height="348" rx="16"/></clipPath>
  </defs>
  <g class="card">
    <g clip-path="url(#clip)">
      <rect width="800" height="350" fill="#ffffff"/>
      <rect width="800" height="350" fill="url(#grid)"/>
      <rect width="800" height="350" fill="url(#glow)"/>
      <rect class="shine" x="0" y="0" width="400" height="3" fill="url(#shine)"/>
    </g>
    <rect x="1" y="1" width="798" height="348" rx="16" fill="none" stroke="#d1d9e0" stroke-width="2"/>
    <text class="tag" x="40" y="60" font-family="Consolas, Menlo, 'SF Mono', 'DejaVu Sans Mono', monospace" font-size="19" fill="#0969da">// sistem informasi bisnis · live demo</text>
    <text class="title" x="40" y="118" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="700" fill="#1f2328">FoodSave</text>
    <rect class="accent" x="40" y="138" width="120" height="3" rx="1.5" fill="url(#line)"/>
    <g class="desc"><text x="40" y="200" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#59636e">Routes surplus food from shops and canteens</text><text x="40" y="236" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#59636e">in Malang to people nearby, tracking CO₂e saved.</text></g>
    <g class="chip" style="animation-delay:0.9s">
      <rect x="40" y="272" width="158" height="44" rx="22" fill="#f6f8fa" stroke="#d1d9e0"/>
      <text x="119" y="302" text-anchor="middle" font-family="Consolas, Menlo, 'SF Mono', 'DejaVu Sans Mono', monospace" font-size="21" fill="#59636e">Laravel 12</text>
    </g><g class="chip" style="animation-delay:1s">
      <rect x="208" y="272" width="71" height="44" rx="22" fill="#f6f8fa" stroke="#d1d9e0"/>
      <text x="243.5" y="302" text-anchor="middle" font-family="Consolas, Menlo, 'SF Mono', 'DejaVu Sans Mono', monospace" font-size="21" fill="#59636e">PHP</text>
    </g><g class="chip" style="animation-delay:1.1s">
      <rect x="289" y="272" width="133" height="44" rx="22" fill="#f6f8fa" stroke="#d1d9e0"/>
      <text x="355.5" y="302" text-anchor="middle" font-family="Consolas, Menlo, 'SF Mono', 'DejaVu Sans Mono', monospace" font-size="21" fill="#59636e">Tailwind</text>
    </g><g class="chip" style="animation-delay:1.2000000000000002s">
      <rect x="432" y="272" width="146" height="44" rx="22" fill="#f6f8fa" stroke="#d1d9e0"/>
      <text x="505" y="302" text-anchor="middle" font-family="Consolas, Menlo, 'SF Mono', 'DejaVu Sans Mono', monospace" font-size="21" fill="#59636e">Alpine.js</text>
    </g>
    
      <ellipse class="ripple" cx="700" cy="132" rx="30" ry="9" fill="none" stroke="#0969da" stroke-width="2"/>
      <ellipse class="ripple ripple2" cx="700" cy="132" rx="30" ry="9" fill="none" stroke="#0969da" stroke-width="2"/>
      <g class="pin">
        <path d="M 700 128 C 690 112 676 98 676 80 A 24 24 0 0 1 724 80 C 724 98 710 112 700 128 Z" fill="#0969da" fill-opacity=".9"/>
        <circle cx="700" cy="80" r="9" fill="#ffffff"/>
      </g>
  </g>
</svg>
