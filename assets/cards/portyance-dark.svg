<svg xmlns="http://www.w3.org/2000/svg" width="800" height="350" viewBox="0 0 800 350">
  <style>
    .card   { animation: fadeUp .7s ease-out 0.90s both; }
    .tag    { animation: fadeIn .6s ease-out 1.10s both; }
    .title  { animation: fadeUp .7s ease-out 1.15s both; }
    .accent { transform-box: fill-box; transform-origin: left center; animation: grow .8s cubic-bezier(.2,.7,.2,1) 1.40s both; }
    .desc   { animation: fadeIn .8s ease-out 1.50s both; }
    .chip   { transform-box: fill-box; transform-origin: center; animation: pop .45s ease-out both; }
    .shine  { --sweep-end: 1200px; animation: sweep 8s ease-in-out 2.40s infinite; }
    .sk { animation: shimmer 3.6s ease-in-out infinite; }
            .caret { animation: blinkc 1.1s steps(1) infinite; }
            @keyframes shimmer { 0%, 100% { fill-opacity: .25; } 50% { fill-opacity: .8; } }
            @keyframes blinkc { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
    
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes grow   { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes pop    { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
  @keyframes sweep  { 0% { transform: translateX(-400px); } 55%, 100% { transform: translateX(var(--sweep-end)); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161b22" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="88%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/><stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="1" y="1" width="798" height="348" rx="16"/></clipPath>
  </defs>
  <g class="card">
    <g clip-path="url(#clip)">
      <rect width="800" height="350" fill="#0d1117"/>
      <rect width="800" height="350" fill="url(#grid)"/>
      <rect width="800" height="350" fill="url(#glow)"/>
      <rect class="shine" x="0" y="0" width="400" height="3" fill="url(#shine)"/>
    </g>
    <rect x="1" y="1" width="798" height="348" rx="16" fill="none" stroke="#30363d" stroke-width="2"/>
    <text class="tag" x="40" y="60" font-family="Consolas, Menlo, 'SF Mono', 'DejaVu Sans Mono', monospace" font-size="19" fill="#58a6ff">// personal portfolio · live</text>
    <text class="title" x="40" y="118" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="700" fill="#e6edf3">Portyance</text>
    <rect class="accent" x="40" y="138" width="120" height="3" rx="1.5" fill="url(#line)"/>
    <g class="desc"><text x="40" y="200" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#8b949e">My portfolio: project case studies, organization</text><text x="40" y="236" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#8b949e">experience, and an interactive animated intro.</text></g>
    <g class="chip" style="animation-delay:1.7999999999999998s">
      <rect x="40" y="272" width="121" height="44" rx="22" fill="#161b22" stroke="#30363d"/>
      <text x="100.5" y="302" text-anchor="middle" font-family="Consolas, Menlo, 'SF Mono', 'DejaVu Sans Mono', monospace" font-size="21" fill="#8b949e">Next.js</text>
    </g><g class="chip" style="animation-delay:1.9s">
      <rect x="171" y="272" width="96" height="44" rx="22" fill="#161b22" stroke="#30363d"/>
      <text x="219" y="302" text-anchor="middle" font-family="Consolas, Menlo, 'SF Mono', 'DejaVu Sans Mono', monospace" font-size="21" fill="#8b949e">React</text>
    </g><g class="chip" style="animation-delay:1.9999999999999998s">
      <rect x="277" y="272" width="108" height="44" rx="22" fill="#161b22" stroke="#30363d"/>
      <text x="331" y="302" text-anchor="middle" font-family="Consolas, Menlo, 'SF Mono', 'DejaVu Sans Mono', monospace" font-size="21" fill="#8b949e">Vercel</text>
    </g>
    
      <rect x="636" y="48" width="132" height="94" rx="10" fill="#0d1117" stroke="#58a6ff" stroke-opacity=".7" stroke-width="2"/>
      <line x1="636" y1="68" x2="768" y2="68" stroke="#58a6ff" stroke-opacity=".5" stroke-width="2"/>
      <circle cx="650" cy="58" r="3.5" fill="#58a6ff" fill-opacity=".8"/>
      <circle cx="662" cy="58" r="3.5" fill="#58a6ff" fill-opacity=".55"/>
      <circle cx="674" cy="58" r="3.5" fill="#58a6ff" fill-opacity=".3"/>
      <rect class="sk" style="animation-delay:0s" x="652" y="86" width="90" height="7" rx="3.5" fill="#58a6ff"/><rect class="sk" style="animation-delay:0.25s" x="652" y="102" width="64" height="7" rx="3.5" fill="#58a6ff"/><rect class="sk" style="animation-delay:0.5s" x="652" y="118" width="78" height="7" rx="3.5" fill="#58a6ff"/>
      <rect class="caret" x="734" y="116" width="3" height="12" fill="#58a6ff"/>
  </g>
</svg>
