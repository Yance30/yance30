<svg xmlns="http://www.w3.org/2000/svg" width="800" height="350" viewBox="0 0 800 350">
  <style>
    .card   { animation: fadeUp .7s ease-out 0.72s both; }
    .tag    { animation: fadeIn .6s ease-out 0.92s both; }
    .title  { animation: fadeUp .7s ease-out 0.97s both; }
    .accent { transform-box: fill-box; transform-origin: left center; animation: grow .8s cubic-bezier(.2,.7,.2,1) 1.22s both; }
    .desc   { animation: fadeIn .8s ease-out 1.32s both; }
    .chip   { transform-box: fill-box; transform-origin: center; animation: pop .45s ease-out both; }
    .shine  { --sweep-end: 1200px; animation: sweep 8s ease-in-out 2.22s infinite; }
    .bar { transform-box: fill-box; transform-origin: bottom; animation: rise 6s cubic-bezier(.2,.7,.2,1) infinite; }
            @keyframes rise { 0% { transform: scaleY(.15); } 18%, 85% { transform: scaleY(1); } 100% { transform: scaleY(.15); } }
    
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes grow   { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes pop    { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
  @keyframes sweep  { 0% { transform: translateX(-400px); } 55%, 100% { transform: translateX(var(--sweep-end)); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f0f3f6" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="88%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#0969da" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0969da" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0969da"/><stop offset="100%" stop-color="#0969da" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0969da" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0969da" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#0969da" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="1" y="1" width="798" height="348" rx="16"/></clipPath>
  </defs>
  <g class="card">
    <g clip-path="url(#clip)">
      <rect width="800" height="350" fill="#ffffff"/>
      <rect width="800" height="350" fill="url(#grid)"/>
      <rect width="800" height="350" fill="url(#glow)"/>
      <rect class="shine" x="0" y="0" width="400" height="3" fill="url(#shine)"/>
    </g>
    <rect x="1" y="1" width="798" height="348" rx="16" fill="none" stroke="#d1d9e0" stroke-width="2"/>
    <text class="tag" x="40" y="60" font-family="Consolas, Menlo, 'SF Mono', 'DejaVu Sans Mono', monospace" font-size="19" fill="#0969da">// islamic finance · live demo</text>
    <text class="title" x="40" y="118" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="700" fill="#1f2328">Tandur</text>
    <rect class="accent" x="40" y="138" width="120" height="3" rx="1.5" fill="url(#line)"/>
    <g class="desc"><text x="40" y="200" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#59636e">Digitizes akad salam financing for Islamic</text><text x="40" y="236" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#59636e">co-ops, with stress-tested contracts &amp; audit trail.</text></g>
    <g class="chip" style="animation-delay:1.62s">
      <rect x="40" y="272" width="158" height="44" rx="22" fill="#f6f8fa" stroke="#d1d9e0"/>
      <text x="119" y="302" text-anchor="middle" font-family="Consolas, Menlo, 'SF Mono', 'DejaVu Sans Mono', monospace" font-size="21" fill="#59636e">JavaScript</text>
    </g><g class="chip" style="animation-delay:1.7200000000000002s">
      <rect x="208" y="272" width="84" height="44" rx="22" fill="#f6f8fa" stroke="#d1d9e0"/>
      <text x="250" y="302" text-anchor="middle" font-family="Consolas, Menlo, 'SF Mono', 'DejaVu Sans Mono', monospace" font-size="21" fill="#59636e">HTML</text>
    </g><g class="chip" style="animation-delay:1.82s">
      <rect x="302" y="272" width="71" height="44" rx="22" fill="#f6f8fa" stroke="#d1d9e0"/>
      <text x="337.5" y="302" text-anchor="middle" font-family="Consolas, Menlo, 'SF Mono', 'DejaVu Sans Mono', monospace" font-size="21" fill="#59636e">CSS</text>
    </g><g class="chip" style="animation-delay:1.9200000000000002s">
      <rect x="383" y="272" width="108" height="44" rx="22" fill="#f6f8fa" stroke="#d1d9e0"/>
      <text x="437" y="302" text-anchor="middle" font-family="Consolas, Menlo, 'SF Mono', 'DejaVu Sans Mono', monospace" font-size="21" fill="#59636e">Vercel</text>
    </g>
    <line x1="642" y1="141" x2="766" y2="141" stroke="#d1d9e0" stroke-width="2"/><rect class="bar" style="animation-delay:0s" x="650" y="114" width="14" height="26" rx="3" fill="#0969da" fill-opacity="0.45"/><rect class="bar" style="animation-delay:0.18s" x="672" y="98" width="14" height="42" rx="3" fill="#0969da" fill-opacity="0.5700000000000001"/><rect class="bar" style="animation-delay:0.36s" x="694" y="106" width="14" height="34" rx="3" fill="#0969da" fill-opacity="0.69"/><rect class="bar" style="animation-delay:0.54s" x="716" y="82" width="14" height="58" rx="3" fill="#0969da" fill-opacity="0.81"/><rect class="bar" style="animation-delay:0.72s" x="738" y="64" width="14" height="76" rx="3" fill="#0969da" fill-opacity="0.9299999999999999"/>
  </g>
</svg>
