<svg xmlns="http://www.w3.org/2000/svg" width="800" height="350" viewBox="0 0 800 350">
  <style>
    .card   { animation: fadeUp .7s ease-out both; }
    .tag    { animation: fadeIn .6s ease-out .2s both; }
    .title  { animation: fadeUp .7s ease-out .25s both; }
    .accent { transform-box: fill-box; transform-origin: left center; animation: grow .8s cubic-bezier(.2,.7,.2,1) .5s both; }
    .desc   { animation: fadeIn .8s ease-out .6s both; }
    .chip   { transform-box: fill-box; transform-origin: center; animation: pop .45s ease-out both; }
    .shine  { --sweep-end: 1200px; animation: sweep 6s ease-in-out 1.5s infinite; }
    .edge { stroke-dasharray: 1; animation: draw 1s ease-out both; }
            .node { transform-box: fill-box; transform-origin: center; animation: breathe 2.5s ease-in-out infinite; }
            .ring { transform-box: fill-box; transform-origin: center; animation: ping 2.5s ease-out 1.5s infinite; }
            @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
            @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.25); } }
            @keyframes ping { 0% { transform: scale(1); opacity: .8; } 80%, 100% { transform: scale(3); opacity: 0; } }
    
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes grow   { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes pop    { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
  @keyframes sweep  { 0% { transform: translateX(-400px); } 55%, 100% { transform: translateX(var(--sweep-end)); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f0f3f6" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="88%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#0969da" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0969da" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0969da"/><stop offset="100%" stop-color="#0969da" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0969da" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0969da" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#0969da" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="1" y="1" width="798" height="348" rx="16"/></clipPath>
  </defs>
  <g class="card">
    <g clip-path="url(#clip)">
      <rect width="800" height="350" fill="#ffffff"/>
      <rect width="800" height="350" fill="url(#grid)"/>
      <rect width="800" height="350" fill="url(#glow)"/>
      <rect class="shine" x="0" y="0" width="400" height="3" fill="url(#shine)"/>
    </g>
    <rect x="1" y="1" width="798" height="348" rx="16" fill="none" stroke="#d1d9e0" stroke-width="2"/>
    <text class="tag" x="40" y="60" font-family="Consolas, Menlo, 'SF Mono', 'DejaVu Sans Mono', monospace" font-size="19" fill="#0969da">// bpjs healthkathon 2026 · live demo</text>
    <text class="title" x="40" y="118" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="700" fill="#1f2328">JALA Fraud Analytics</text>
    <rect class="accent" x="40" y="138" width="120" height="3" rx="1.5" fill="url(#line)"/>
    <g class="desc"><text x="40" y="200" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#59636e">Graph-based audit prioritization for health</text><text x="40" y="236" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#59636e">claims: 436 vs. 91 fraud cases caught (synthetic).</text></g>
    <g class="chip" style="animation-delay:0.9s">
      <rect x="40" y="272" width="108" height="44" rx="22" fill="#f6f8fa" stroke="#d1d9e0"/>
      <text x="94" y="302" text-anchor="middle" font-family="Consolas, Menlo, 'SF Mono', 'DejaVu Sans Mono', monospace" font-size="21" fill="#59636e">Python</text>
    </g><g class="chip" style="animation-delay:1s">
      <rect x="158" y="272" width="146" height="44" rx="22" fill="#f6f8fa" stroke="#d1d9e0"/>
      <text x="231" y="302" text-anchor="middle" font-family="Consolas, Menlo, 'SF Mono', 'DejaVu Sans Mono', monospace" font-size="21" fill="#59636e">Streamlit</text>
    </g><g class="chip" style="animation-delay:1.1s">
      <rect x="314" y="272" width="133" height="44" rx="22" fill="#f6f8fa" stroke="#d1d9e0"/>
      <text x="380.5" y="302" text-anchor="middle" font-family="Consolas, Menlo, 'SF Mono', 'DejaVu Sans Mono', monospace" font-size="21" fill="#59636e">NetworkX</text>
    </g><g class="chip" style="animation-delay:1.2000000000000002s">
      <rect x="457" y="272" width="183" height="44" rx="22" fill="#f6f8fa" stroke="#d1d9e0"/>
      <text x="548.5" y="302" text-anchor="middle" font-family="Consolas, Menlo, 'SF Mono', 'DejaVu Sans Mono', monospace" font-size="21" fill="#59636e">scikit-learn</text>
    </g>
    <line class="edge" style="animation-delay:0.6s" x1="640" y1="96" x2="690" y2="52" stroke="#0969da" stroke-opacity=".45" stroke-width="1.6" pathLength="1"/><line class="edge" style="animation-delay:0.72s" x1="690" y1="52" x2="744" y2="84" stroke="#0969da" stroke-opacity=".45" stroke-width="1.6" pathLength="1"/><line class="edge" style="animation-delay:0.84s" x1="744" y1="84" x2="716" y2="124" stroke="#0969da" stroke-opacity=".45" stroke-width="1.6" pathLength="1"/><line class="edge" style="animation-delay:0.96s" x1="716" y1="124" x2="662" y2="140" stroke="#0969da" stroke-opacity=".45" stroke-width="1.6" pathLength="1"/><line class="edge" style="animation-delay:1.08s" x1="662" y1="140" x2="640" y2="96" stroke="#0969da" stroke-opacity=".45" stroke-width="1.6" pathLength="1"/><line class="edge" style="animation-delay:1.2s" x1="690" y1="52" x2="716" y2="124" stroke="#0969da" stroke-opacity=".45" stroke-width="1.6" pathLength="1"/><line class="edge" style="animation-delay:1.3199999999999998s" x1="640" y1="96" x2="744" y2="84" stroke="#0969da" stroke-opacity=".45" stroke-width="1.6" pathLength="1"/><circle class="ring" cx="744" cy="84" r="7" fill="none" stroke="#0969da" stroke-width="2"/><circle class="node" style="animation-delay:0s" cx="640" cy="96" r="5" fill="#ffffff" stroke="#0969da" stroke-width="2"/><circle class="node" style="animation-delay:0.5s" cx="690" cy="52" r="5" fill="#ffffff" stroke="#0969da" stroke-width="2"/><circle class="node" style="animation-delay:1s" cx="744" cy="84" r="7" fill="#0969da" stroke="#0969da" stroke-width="2"/><circle class="node" style="animation-delay:1.5s" cx="716" cy="124" r="5" fill="#ffffff" stroke="#0969da" stroke-width="2"/><circle class="node" style="animation-delay:2s" cx="662" cy="140" r="5" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
  </g>
</svg>
