<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="90" viewBox="0 0 1500 90">
  <style>
    .msg    { animation: fadeIn 1s ease-out .3s both; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .shine  { animation: sweep 5s ease-in-out .8s infinite; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes blink  { 0%, 50% { fill-opacity: 1; } 50.01%, 100% { fill-opacity: 0; } }
    @keyframes sweep  { 0% { transform: translateX(-360px); } 60%, 100% { transform: translateX(1560px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#161b22" stroke-width="1"/>
    </pattern>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0"/>
      <stop offset="40%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1500" height="90" fill="#0d1117"/>
  <rect width="1500" height="90" fill="url(#grid)"/>
  <rect x="0" y="0" width="1500" height="6" fill="url(#line)"/>
  <rect class="shine" x="0" y="0" width="360" height="6" fill="url(#shine)" opacity="0.6"/>
  <text class="msg" x="750" y="58" text-anchor="middle" font-family="Consolas, Menlo, 'SF Mono', 'DejaVu Sans Mono', monospace" font-size="22" fill="#8b949e">git commit -m "keep building"<tspan class="cursor" fill="#58a6ff"> ▋</tspan></text>
</svg>
