<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="420" viewBox="0 0 1500 420">
  <style>
    .mono { font-family: Consolas, Menlo, 'SF Mono', 'DejaVu Sans Mono', monospace; }
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }

    .prompt  { animation: fadeUp .7s ease-out .1s both; }
    .title   { animation: fadeUp .8s ease-out .35s both; }
    .accent  { transform-box: fill-box; transform-origin: left center; animation: grow .9s cubic-bezier(.2,.7,.2,1) .8s both; }
    .tagline { animation: fadeUp .8s ease-out 1.1s both; }
    .ticker  { animation: fadeUp .8s ease-out 1.4s both; }
    .cursor  { animation: blink 1.1s steps(1) infinite; }

    .role { opacity: 0; transform-box: fill-box; animation: role 9s ease-in-out infinite both; }
    .r1 { opacity: 1; animation-delay: 1.4s; }
    .r2 { animation-delay: 4.4s; }
    .r3 { animation-delay: 7.4s; }

    .glow   { animation: pulse 7s ease-in-out infinite; }
    .code   { animation: float 6s ease-in-out infinite alternate; }
    .spark  { stroke-dasharray: 900; animation: draw 2.6s ease-out 1s both; }
    .area   { animation: fadeIn 1.2s ease-out 2.6s both; }
    .dot    { transform-box: fill-box; transform-origin: center; animation: fadeIn .4s ease-out 3.4s both, ping 2.4s ease-out 3.6s infinite; }
    .shine  { animation: sweep 5s ease-in-out 1.6s infinite; }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes grow   { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes blink  { 0%, 50% { fill-opacity: 1; } 50.01%, 100% { fill-opacity: 0; } }
    @keyframes role   {
      0%   { opacity: 0; transform: translateY(10px); }
      4%   { opacity: 1; transform: none; }
      30%  { opacity: 1; transform: none; }
      34%  { opacity: 0; transform: translateY(-10px); }
      100% { opacity: 0; transform: translateY(-10px); }
    }
    @keyframes pulse  { 0%, 100% { opacity: .65; } 50% { opacity: 1; } }
    @keyframes float  { from { transform: translateY(0); } to { transform: translateY(-12px); } }
    @keyframes draw   { from { stroke-dashoffset: 900; } to { stroke-dashoffset: 0; } }
    @keyframes ping   { 0% { transform: scale(1); opacity: .9; } 80%, 100% { transform: scale(3.2); opacity: 0; } }
    @keyframes sweep  { 0% { transform: translateX(-360px); } 60%, 100% { transform: translateX(1560px); } }

    .p  { opacity: 0; }
    .p1 { animation: p1 8s ease-in-out 1.0s infinite; }
    .p2 { animation: p2 10s ease-in-out 3.5s infinite; }
    .p3 { animation: p3 7s ease-in-out 2.0s infinite; }
    .p4 { animation: p4 9s ease-in-out 5.0s infinite; }
    .p5 { animation: p5 8s ease-in-out 6.5s infinite; }
    .p6 { animation: p6 9s ease-in-out 4.2s infinite; }
    @keyframes p1 { 0% { transform: translateX(0); opacity: 0; } 6% { opacity: 1; } 58% { opacity: 1; } 65%, 100% { transform: translateX(800px); opacity: 0; } }
    @keyframes p2 { 0% { transform: translateX(0); opacity: 0; } 6% { opacity: 1; } 58% { opacity: 1; } 65%, 100% { transform: translateX(880px); opacity: 0; } }
    @keyframes p3 { 0% { transform: translateY(0); opacity: 0; } 6% { opacity: 1; } 58% { opacity: 1; } 65%, 100% { transform: translateY(420px); opacity: 0; } }
    @keyframes p4 { 0% { transform: translateX(0); opacity: 0; } 6% { opacity: 1; } 58% { opacity: 1; } 65%, 100% { transform: translateX(616px); opacity: 0; } }
    @keyframes p5 { 0% { transform: translateY(0); opacity: 0; } 6% { opacity: 1; } 58% { opacity: 1; } 65%, 100% { transform: translateY(-420px); opacity: 0; } }
    @keyframes p6 { 0% { transform: translateX(0); opacity: 0; } 6% { opacity: 1; } 58% { opacity: 1; } 65%, 100% { transform: translateX(-880px); opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#161b22" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="85%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="60%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="trailR" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/><stop offset="100%" stop-color="#58a6ff" stop-opacity="0.9"/></linearGradient>
    <linearGradient id="trailL" x1="100%" y1="0%" x2="0%" y2="0%"><stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/><stop offset="100%" stop-color="#58a6ff" stop-opacity="0.9"/></linearGradient>
    <linearGradient id="trailD" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/><stop offset="100%" stop-color="#58a6ff" stop-opacity="0.9"/></linearGradient>
    <linearGradient id="trailU" x1="0%" y1="100%" x2="0%" y2="0%"><stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/><stop offset="100%" stop-color="#58a6ff" stop-opacity="0.9"/></linearGradient>
    <g id="head"><circle r="7" fill="#58a6ff" fill-opacity="0.22"/><circle r="2.6" fill="#58a6ff"/></g>
    <linearGradient id="area" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1500" height="420" fill="#0d1117"/>
  <rect width="1500" height="420" fill="url(#grid)"/>
  <rect class="glow" width="1500" height="420" fill="url(#glow)"/>

  <!-- data particles travelling along grid lines -->
  <g transform="translate(700 44)"><g class="p p1"><rect x="-80" y="-1" width="80" height="2" fill="url(#trailR)"/><use href="#head"/></g></g>
  <g transform="translate(20 396)"><g class="p p2"><rect x="-80" y="-1" width="80" height="2" fill="url(#trailR)"/><use href="#head"/></g></g>
  <g transform="translate(1012 0)"><g class="p p3"><rect x="-1" y="-80" width="2" height="80" fill="url(#trailD)"/><use href="#head"/></g></g>
  <g transform="translate(880 352)"><g class="p p4"><rect x="-80" y="-1" width="80" height="2" fill="url(#trailR)"/><use href="#head"/></g></g>
  <g transform="translate(1320 420)"><g class="p p5"><rect x="-1" y="0" width="2" height="80" fill="url(#trailU)"/><use href="#head"/></g></g>
  <g transform="translate(1480 88)"><g class="p p6"><rect x="0" y="-1" width="80" height="2" fill="url(#trailL)"/><use href="#head"/></g></g>

  <!-- data sparkline -->
  <path class="area" d="M 860 330 L 940 300 L 1010 312 L 1080 262 L 1150 276 L 1220 222 L 1290 236 L 1360 180 L 1430 150 L 1430 400 L 860 400 Z" fill="url(#area)"/>
  <path class="spark" d="M 860 330 L 940 300 L 1010 312 L 1080 262 L 1150 276 L 1220 222 L 1290 236 L 1360 180 L 1430 150" fill="none" stroke="#58a6ff" stroke-opacity="0.55" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle class="dot" cx="1430" cy="150" r="5" fill="#58a6ff"/>

  <g class="code">
    <text x="1120" y="300" class="mono" font-size="180" font-weight="bold" fill="#1f6feb" fill-opacity="0.10">&lt;/&gt;</text>
  </g>

  <text class="prompt mono" x="84" y="128" font-size="24" fill="#58a6ff">~/yance30 $<tspan class="cursor" fill="#58a6ff"> ▋</tspan></text>
  <text class="title sans" x="80" y="215" font-size="56" font-weight="700" fill="#e6edf3">Yance Adhy Nata Panjaitan</text>

  <rect class="accent" x="84" y="248" width="320" height="4" rx="2" fill="url(#line)"/>

  <text class="tagline sans" x="84" y="305" font-size="24" fill="#8b949e">Turning business needs into digital solutions</text>

  <g class="ticker mono" font-size="20">
    <text x="84" y="352" fill="#6e7681">focus:</text>
    <text class="role r1" x="164" y="352" fill="#58a6ff">business intelligence</text>
    <text class="role r2" x="164" y="352" fill="#58a6ff">web development</text>
    <text class="role r3" x="164" y="352" fill="#58a6ff">data analytics</text>
  </g>

  <rect x="0" y="414" width="1500" height="6" fill="url(#line)"/>
  <rect class="shine" x="0" y="414" width="360" height="6" fill="url(#shine)" opacity="0.6"/>
</svg>
