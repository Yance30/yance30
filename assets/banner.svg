<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="420" viewBox="0 0 1500 420">
  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#161b22" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="85%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="60%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1500" height="420" fill="#0d1117"/>
  <rect width="1500" height="420" fill="url(#grid)"/>
  <rect width="1500" height="420" fill="url(#glow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="6s" repeatCount="indefinite"/>
  </rect>

  <text x="1150" y="330" font-family="Consolas, Menlo, monospace" font-size="200" font-weight="bold" fill="#1f6feb" fill-opacity="0.14">&lt;/&gt;</text>

  <text x="84" y="128" font-family="Consolas, Menlo, monospace" font-size="24" fill="#58a6ff">~/yance30</text>
  <rect x="240" y="112" width="14" height="24" fill="#58a6ff">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <text x="80" y="215" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#e6edf3">Yance Adhy Nata Panjaitan</text>

  <rect x="84" y="248" width="320" height="4" rx="2" fill="url(#line)"/>

  <text x="84" y="305" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e">Turning business needs into digital solutions</text>

  <rect x="0" y="414" width="1500" height="6" fill="url(#line)"/>
</svg>