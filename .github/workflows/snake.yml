name: Generate snake animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Yance30
          outputs: |
            dist/github-snake.svg?color_snake=%231f6feb&color_dots=%23ebedf0,%23c6d4e8,%238fb3e0,%235886d4,%231f6feb
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2358a6ff&color_dots=%23161b22,%2321304a,%232d4a7a,%233d6db5,%2358a6ff

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}