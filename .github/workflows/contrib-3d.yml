name: Generate 3D contribution graph

on:
  schedule:
    - cron: "0 18 * * *" # daily, 01:00 WIB
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/profile-3d-settings.json"
      - ".github/workflows/contrib-3d.yml"

permissions:
  contents: write

concurrency:
  group: contrib-3d
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d-settings.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib
          if git commit -m "Update 3D contribution graph [skip ci]"; then
            git pull --rebase
            git push
          fi
